<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#245f46"><title>Chelsea & Justin's Ridebook</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#17231d;--muted:#607066;--accent:#246b4a;--line:#dbe4dd;--warm:#f0e7d6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
button,input,select,textarea{font:inherit}button{min-height:48px;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#e6eee9;color:var(--ink)}.danger{background:#f7e6e4;color:#7d241c}
header{padding:28px 18px 20px;background:linear-gradient(135deg,#173d2c,#2f7554);color:#fff}header h1{margin:0 0 6px;font-size:clamp(28px,7vw,44px)}header p{margin:0;opacity:.92}.wrap{max-width:1050px;margin:auto;padding:18px}.hidden{display:none!important}
.auth{max-width:480px;margin:30px auto;background:var(--card);padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001}.auth input{width:100%;margin:6px 0 12px;padding:14px;border:1px solid var(--line);border-radius:10px}.auth button{width:100%}
nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.active{background:var(--accent);color:#fff}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}.stat{background:var(--card);padding:16px;border-radius:14px;border:1px solid var(--line)}.stat b{font-size:26px;display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.card h3{margin:0 0 5px}.meta{color:var(--muted);font-size:15px}.notes{white-space:pre-wrap;margin:10px 0}.stars{font-size:20px}.pill{display:inline-block;background:var(--warm);border-radius:99px;padding:5px 9px;margin:5px 3px 0 0;font-size:14px}
dialog{border:0;border-radius:18px;padding:0;max-width:620px;width:calc(100% - 24px);max-height:90vh}.form{padding:20px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #bfcac2;border-radius:10px}.field textarea{min-height:100px}.actions{display:flex;gap:8px;justify-content:flex-end}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border-radius:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head>
<body><header><h1>🚲 Chelsea & Justin's Ridebook</h1><p>Ride it. Rate it. Remember it. Plan the next one.</p></header>
<main class="wrap">
<section id="auth" class="auth"><h2>Sign in</h2><p>Use your Ridebook account.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="primary" onclick="signIn()">Sign in</button><p id="authMsg"></p></section>
<section id="app" class="hidden"><div class="topline"><div id="who" class="meta"></div><button class="secondary" onclick="signOut()">Sign out</button></div>
<nav><button id="tabRides" class="active" onclick="showTab('rides')">Completed rides</button><button id="tabIdeas" class="secondary" onclick="showTab('ideas')">Future rides</button></nav>
<div id="stats" class="stats"></div><div class="toolbar"><button class="primary" id="addBtn" onclick="openForm()">＋ Add completed ride</button><button class="secondary" onclick="loadData()">↻ Refresh</button></div><div id="cards" class="cards"></div></section></main>
<dialog id="editor"><form class="form" onsubmit="saveItem(event)"><h2 id="formTitle"></h2><input type="hidden" id="itemId"><div class="grid">
<div class="field"><label>Ride name *</label><input id="rideName" required></div><div class="field"><label>Location</label><input id="location"></div>
<div class="field rideOnly"><label>Date</label><input id="rideDate" type="date"></div><div class="field"><label id="milesLabel">Miles</label><input id="miles" type="number" step=".1" min="0"></div>
<div class="field"><label id="elevLabel">Elevation gain (ft)</label><input id="elevation" type="number" min="0"></div><div class="field"><label>Surface</label><input id="surface"></div>
<div class="field"><label>Difficulty</label><select id="difficulty"><option></option><option>Easy</option><option>Moderate</option><option>Hard</option></select></div>
<div class="field rideOnly"><label>Chelsea rating</label><select id="chelseaRating"><option></option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
<div class="field rideOnly"><label>Justin rating</label><select id="justinRating"><option></option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
<div class="field ideaOnly hidden"><label>Status</label><select id="status"><option>Want to Ride</option><option>Planning</option><option>Next Ride</option></select></div>
<div class="field"><label>Best season</label><input id="season"></div><div class="field"><label>Start / parking location</label><input id="startLocation"></div><div class="field"><label>Map / info link</label><input id="mapUrl" type="url"></div></div>
<div class="field"><label>Notes</label><textarea id="notes"></textarea></div><div class="actions"><button type="button" class="secondary" onclick="editor.close()">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<script>
const sb=supabase.createClient('https://ebkmgxawxmhqucbycpxm.supabase.co','sb_publishable_uUs4oAfgwlnXEjV38RCfTw_E6YAkm6j');
let currentTab='rides',rides=[],ideas=[];const $=id=>document.getElementById(id),val=id=>$(id).value.trim(),num=v=>v===''?null:Number(v);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stars=v=>v?'★'.repeat(Math.round(v))+'☆'.repeat(5-Math.round(v)):'';
async function signIn(){let {error}=await sb.auth.signInWithPassword({email:val('email'),password:$('password').value});$('authMsg').textContent=error?error.message:'';if(!error)init()}
async function signOut(){await sb.auth.signOut();location.reload()}async function init(){let {data:{session}}=await sb.auth.getSession();if(!session)return;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Signed in as '+session.user.email;loadData()}
async function loadData(){let [r,i]=await Promise.all([sb.from('rides').select('*'),sb.from('ride_ideas').select('*')]);if(r.error||i.error){$('cards').innerHTML='<div class="empty">'+esc((r.error||i.error).message)+'</div>';return}rides=r.data||[];ideas=i.data||[];render()}
function showTab(t){currentTab=t;$('tabRides').className=t==='rides'?'active':'secondary';$('tabIdeas').className=t==='ideas'?'active':'secondary';$('addBtn').textContent=t==='rides'?'＋ Add completed ride':'＋ Add future ride';render()}
function render(){let miles=rides.reduce((a,r)=>a+(+r.miles||0),0),elev=rides.reduce((a,r)=>a+(+r.elevation_gain||0),0);$('stats').innerHTML=`<div class="stat"><b>${rides.length}</b>rides completed</div><div class="stat"><b>${miles.toFixed(1)}</b>miles logged</div><div class="stat"><b>${elev.toLocaleString()}</b>feet climbed</div><div class="stat"><b>${ideas.length}</b>future ideas</div>`;let d=currentTab==='rides'?rides:ideas;$('cards').innerHTML=d.length?d.map(card).join(''):'<div class="empty">Nothing here yet.</div>'}
function card(x){let idea=currentTab==='ideas',mi=idea?x.estimated_miles:x.miles,el=idea?x.estimated_elevation:x.elevation_gain;return `<article class="card"><h3>${esc(x.ride_name)}</h3><div class="meta">${[x.location,mi!=null?mi+' mi':null,el!=null?el+' ft':null,x.surface].filter(Boolean).map(esc).join(' • ')}</div>${!idea&&x.chelsea_rating?'<div>Chelsea '+stars(x.chelsea_rating)+'</div>':''}${!idea&&x.justin_rating?'<div>Justin '+stars(x.justin_rating)+'</div>':''}${idea&&x.status?'<span class="pill">'+esc(x.status)+'</span>':''}${x.notes?'<div class="notes">'+esc(x.notes)+'</div>':''}<div class="toolbar"><button class="secondary" onclick="editItem('${x.id}')">Edit</button>${idea?`<button class="primary" onclick="rodeIt('${x.id}')">We rode it!</button>`:''}<button class="danger" onclick="removeItem('${x.id}')">Delete</button></div></article>`}
function openForm(x=null){$('itemId').value=x?.id||'';$('rideName').value=x?.ride_name||'';$('location').value=x?.location||'';$('rideDate').value=x?.ride_date||'';$('miles').value=(currentTab==='rides'?x?.miles:x?.estimated_miles)??'';$('elevation').value=(currentTab==='rides'?x?.elevation_gain:x?.estimated_elevation)??'';$('surface').value=x?.surface||'';$('difficulty').value=x?.difficulty||'';$('chelseaRating').value=x?.chelsea_rating||'';$('justinRating').value=x?.justin_rating||'';$('status').value=x?.status||'Want to Ride';$('season').value=x?.best_season||'';$('startLocation').value=x?.start_location||'';$('mapUrl').value=x?.map_url||'';$('notes').value=x?.notes||'';document.querySelectorAll('.rideOnly').forEach(e=>e.classList.toggle('hidden',currentTab!=='rides'));document.querySelectorAll('.ideaOnly').forEach(e=>e.classList.toggle('hidden',currentTab!=='ideas'));$('formTitle').textContent=(x?'Edit ':'Add ')+(currentTab==='rides'?'completed ride':'future ride');$('editor').showModal()}
function editItem(id){openForm((currentTab==='rides'?rides:ideas).find(x=>x.id===id))}
async function saveItem(e){e.preventDefault();let {data:{user}}=await sb.auth.getUser(),id=val('itemId'),p=currentTab==='rides'?{ride_name:val('rideName'),location:val('location')||null,ride_date:val('rideDate')||null,miles:num(val('miles')),elevation_gain:num(val('elevation')),surface:val('surface')||null,difficulty:val('difficulty')||null,chelsea_rating:num(val('chelseaRating')),justin_rating:num(val('justinRating')),best_season:val('season')||null,start_location:val('startLocation')||null,map_url:val('mapUrl')||null,notes:val('notes')||null}:{ride_name:val('rideName'),location:val('location')||null,estimated_miles:num(val('miles')),estimated_elevation:num(val('elevation')),surface:val('surface')||null,difficulty:val('difficulty')||null,status:val('status'),best_season:val('season')||null,start_location:val('startLocation')||null,map_url:val('mapUrl')||null,notes:val('notes')||null};if(!id)p.created_by=user.id;let table=currentTab==='rides'?'rides':'ride_ideas',q=id?sb.from(table).update(p).eq('id',id):sb.from(table).insert(p),{error}=await q;if(error)return alert(error.message);$('editor').close();loadData()}
async function removeItem(id){if(!confirm('Delete this from the Ridebook?'))return;let {error}=await sb.from(currentTab==='rides'?'rides':'ride_ideas').delete().eq('id',id);if(error)alert(error.message);else loadData()}
async function rodeIt(id){let x=ideas.find(i=>i.id===id),{data:{user}}=await sb.auth.getUser();let {error}=await sb.from('rides').insert({ride_name:x.ride_name,location:x.location,miles:x.estimated_miles,elevation_gain:x.estimated_elevation,surface:x.surface,difficulty:x.difficulty,notes:x.notes,best_season:x.best_season,start_location:x.start_location,map_url:x.map_url,created_by:user.id});if(error)return alert(error.message);await sb.from('ride_ideas').delete().eq('id',id);currentTab='rides';showTab('rides');loadData()}
init();
</script></body></html>
